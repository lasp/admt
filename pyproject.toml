[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "admt"
description = "The Adamant Multitool -- a CLI for the Adamant embedded software framework."
readme = "README.md"
dynamic = ["version"]
requires-python = ">=3.14"
license = { text = "Apache-2.0" }
authors = [
    { name = "Jacob Seman", email = "jase4878@lasp.colorado.edu" },
]
keywords = ["adamant", "embedded", "fsw", "cli"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Embedded Systems",
]
dependencies = [
    "click>=8.1,<9",
    "ruamel.yaml>=0.18,<0.19",
]

[project.scripts]
admt = "admt.main:main"

[project.urls]
Homepage = "https://github.com/lasp/admt"

[dependency-groups]
dev = [
    "pytest>=8.0,<9",
    "pytest-cov>=5.0,<7",
    "mypy>=1.11,<2",
    "ruff>=0.6,<1",
]

[tool.hatch.version]
path = "src/admt/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/admt"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort (import sorting)
    "N",     # pep8-naming
    "UP",    # pyupgrade (modernize syntax)
    "B",     # flake8-bugbear (common bugs)
    "A",     # flake8-builtins (shadowing builtins)
    "ANN",   # flake8-annotations (type annotation presence)
    "ARG",   # flake8-unused-arguments
    "C4",    # flake8-comprehensions (simplify comprehensions)
    "DTZ",   # flake8-datetimez (timezone-aware datetimes)
    "EM",    # flake8-errmsg (string literal in exceptions)
    "ERA",   # eradicate (commented-out code)
    "FBT",   # flake8-boolean-trap (boolean positional args)
    "ICN",   # flake8-import-conventions
    "ISC",   # flake8-implicit-str-concat
    "PIE",   # flake8-pie (misc lints)
    "PL",    # pylint rules (errors, warnings, refactoring)
    "PT",    # flake8-pytest-style
    "Q",     # flake8-quotes
    "RET",   # flake8-return (return statement lints)
    "RSE",   # flake8-raise (raise statement lints)
    "RUF",   # ruff-specific rules
    "S",     # flake8-bandit (security)
    "SIM",   # flake8-simplify
    "T20",   # flake8-print (no print statements -- use output service)
    "TCH",   # flake8-type-checking (move imports to TYPE_CHECKING)
    "TID",   # flake8-tidy-imports
    "TRY",   # tryceratops (exception handling)
    "D",     # pydocstyle (docstring conventions)
    "PTH",   # flake8-use-pathlib (enforce pathlib over os.path)
    "C90",   # mccabe (cyclomatic complexity)
    "PERF",  # perflint (performance lints)
]
ignore = [
    "ISC001",  # conflicts with ruff formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",    # assert is fine in tests
    "ANN",     # test annotations encouraged but not enforced by linter
    "ARG",     # unused fixture args are normal in pytest
    "D",       # test docstrings are optional (test names are documentation)
    "PLR0913", # pytest fixtures push tests past the default 5-argument limit
]
"src/admt/adapters/**/*.py" = [
    "S603",    # subprocess call -- required for docker/redo integration
    "S607",    # partial executable path -- required for docker/redo
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_unreachable = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
check_untyped_defs = true
no_implicit_optional = true
no_implicit_reexport = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "container: tests that require a running Docker container",
]

[tool.coverage.run]
source = ["admt"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
